<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#052c32">
  <title>Расходники · OMG Shift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/furore" rel="stylesheet">
  <link rel="stylesheet" href="/static/shift_config.css">
  <link rel="stylesheet" href="/static/shift.css?v=20260901-1">
  <link rel="stylesheet" href="/static/shift_consumables.css?v=20260901-1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body data-swipe-back="/shift">
  <main id="consumablesPage" class="shift-shell consumables-shell">
    <a id="consumablesBack" class="consumables-back" href="/shift">‹ OMG Shift</a>
    <header class="shift-header consumables-header">
      <div class="shift-title">
        <p id="consumablesUserName" class="eyebrow">Команда OMG VR</p>
        <h1>РАСХОДНИКИ</h1>
      </div>
      <div id="consumablesRole" class="user-badge">Загрузка…</div>
    </header>
    <p class="shift-subtitle">Остатки клуба, фотографии товаров и полная история изменений.</p>

    <section class="consumables-overview" aria-label="Сводка склада">
      <article><small>Активных</small><strong id="consumablesActiveCount">—</strong></article>
      <article class="low"><small>Заканчивается</small><strong id="consumablesLowCount">—</strong></article>
      <article id="consumablesArchiveSummary"><small>В архиве</small><strong id="consumablesArchivedCount">—</strong></article>
    </section>

    <section class="consumables-workspace">
      <div class="consumables-controls">
        <div class="consumables-toolbar">
          <label><span>Клуб</span><select id="consumablesClub"></select></label>
          <div class="consumables-management">
            <button id="manageConsumableCategories" class="consumables-categories-button" type="button" hidden>Категории</button>
            <button id="addConsumable" class="consumables-add" type="button" hidden>+ Добавить товар</button>
          </div>
        </div>
        <div class="consumables-search-row">
          <input id="consumablesSearch" type="search" placeholder="Найти товар" autocomplete="off">
          <label id="consumablesArchiveLabel" class="archive-toggle" hidden>
            <input id="consumablesArchived" type="checkbox"><span>Показать архив</span>
          </label>
        </div>
        <div id="consumablesCategories" class="consumables-categories"></div>
      </div>
      <div id="consumablesStatus" class="consumables-status"></div>
      <div id="consumablesList" class="consumables-list">
        <div class="shift-empty">Загружаю остатки…</div>
      </div>
    </section>

    <div id="consumablesError" class="error-card" hidden></div>
  </main>

  <div id="consumableModal" class="consumable-modal" hidden>
    <div class="consumable-modal-backdrop" data-close-consumable-modal></div>
    <section class="consumable-modal-card" role="dialog" aria-modal="true" aria-labelledby="consumableModalTitle">
      <div class="consumable-modal-head">
        <div><p class="eyebrow">Расходники</p><h2 id="consumableModalTitle"></h2></div>
        <button type="button" aria-label="Закрыть" data-close-consumable-modal>×</button>
      </div>
      <div id="consumableModalBody"></div>
    </section>
  </div>

  <script src="/static/shift_consumables.js?v=20260901-1"></script>
  <script src="/static/swipe_navigation.js"></script>
</body>
</html>
