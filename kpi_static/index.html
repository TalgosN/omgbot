<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#01032b">
  <title>KPI OMG VR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Команда OMG VR</p>
        <h1>OMG KPI</h1>
      </div>
      <div id="userBadge" class="user-badge skeleton">Загрузка…</div>
    </header>

    <nav class="view-tabs" aria-label="Разделы KPI">
      <button class="view-tab active" type="button" data-view="rating">Рейтинг</button>
      <button class="view-tab" type="button" data-view="analytics">Аналитика</button>
    </nav>

    <section id="ratingView">
      <section class="period-panel">
        <button id="previousDay" class="icon-button" aria-label="Предыдущий день">‹</button>
        <label class="date-label">
          <span>Рейтинг на дату</span>
          <strong id="dateDisplay">28.07.2026</strong>
          <input id="datePicker" type="date" aria-label="Выбрать дату">
        </label>
        <button id="nextDay" class="icon-button" aria-label="Следующий день">›</button>
        <button id="monthStatusButton" class="status-button" hidden></button>
      </section>

      <section id="summary" class="summary-grid" aria-live="polite"></section>

      <section class="toolbar">
        <label class="search">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="Найти сотрудника">
        </label>
        <span id="resultCount" class="result-count"></span>
      </section>

      <section id="employeeList" class="employee-list" aria-live="polite">
        <div class="loading-card"></div>
        <div class="loading-card"></div>
        <div class="loading-card"></div>
      </section>
    </section>

    <section id="analyticsView" class="analytics-view" hidden>
      <section class="analytics-controls">
        <label class="control-field">
          <span>Период</span>
          <select id="analyticsMode">
            <option value="daily">По дням месяца</option>
            <option value="monthly">По месяцам за год</option>
          </select>
        </label>
        <label class="control-field">
          <span>Месяц</span>
          <input id="analyticsMonth" type="month">
        </label>
        <label class="control-field">
          <span>Данные</span>
          <select id="analyticsScope">
            <option value="team">Общие</option>
            <option value="individual">Сотрудники</option>
          </select>
        </label>
        <label class="control-field">
          <span>График</span>
          <select id="analyticsChart"></select>
        </label>
        <label id="metricField" class="control-field" hidden>
          <span>Показатель</span>
          <select id="analyticsMetric">
            <option value="reviews">Отзывы</option>
            <option value="forms">Анкеты</option>
            <option value="extensions">Продления</option>
            <option value="certificates">Сертификаты</option>
            <option value="subscriptions">Абонементы</option>
            <option value="initiatives">Инициативы</option>
          </select>
        </label>
        <label id="weightedField" class="toggle-field">
          <input id="analyticsWeighted" type="checkbox">
          <span>Взвешенные значения</span>
        </label>
      </section>

      <section id="employeePicker" class="employee-picker" hidden>
        <div class="picker-heading">
          <span>Сравнить сотрудников</span>
          <small>Можно выбрать до 5</small>
        </div>
        <div id="employeeChips" class="employee-chips"></div>
      </section>

      <section class="chart-card">
        <div class="chart-heading">
          <div>
            <p id="chartEyebrow" class="eyebrow">Команда</p>
            <h2 id="chartTitle">Средний KPI</h2>
          </div>
          <strong id="chartCurrent" class="chart-current"></strong>
        </div>
        <div id="analyticsChartArea" class="chart-area">
          <div class="loading-card chart-loading"></div>
        </div>
        <div id="chartLegend" class="chart-legend"></div>
      </section>

      <section id="analyticsSummary" class="analytics-summary"></section>
    </section>
  </main>

  <dialog id="employeeDialog" class="dialog">
    <div class="dialog-header">
      <div>
        <p id="dialogLogin" class="eyebrow"></p>
        <h2 id="dialogName"></h2>
      </div>
      <button class="icon-button close-dialog" aria-label="Закрыть">×</button>
    </div>
    <div id="dialogContent"></div>
  </dialog>

  <dialog id="penaltyDialog" class="dialog dialog-small">
    <form id="penaltyForm">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Штраф −10% KPI</p>
          <h2 id="penaltyEmployee"></h2>
        </div>
        <button type="button" class="icon-button close-dialog" aria-label="Закрыть">×</button>
      </div>
      <label class="field">
        <span>Причина</span>
        <textarea id="penaltyReason" maxlength="500" required placeholder="Кратко опишите причину штрафа"></textarea>
      </label>
      <button class="primary-button" type="submit">Добавить штраф</button>
    </form>
  </dialog>

  <dialog id="entriesDialog" class="dialog dialog-small">
    <div class="dialog-header">
      <div>
        <p id="entriesEmployee" class="eyebrow"></p>
        <h2 id="entriesTitle"></h2>
      </div>
      <button class="icon-button close-dialog" aria-label="Закрыть">×</button>
    </div>
    <p id="entriesPeriod" class="entries-period"></p>
    <div id="entriesContent" class="entries-list"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
