<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#01032b">
  <title>KPI OMG VR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Команда OMG VR</p>
        <h1>OMG KPI</h1>
      </div>
      <div id="userBadge" class="user-badge skeleton">Загрузка…</div>
    </header>

    <section class="period-panel">
      <button id="previousDay" class="icon-button" aria-label="Предыдущий день">‹</button>
      <label class="date-label">
        <span>Рейтинг на дату</span>
        <input id="datePicker" type="date">
      </label>
      <button id="nextDay" class="icon-button" aria-label="Следующий день">›</button>
      <button id="monthStatusButton" class="status-button" hidden></button>
    </section>

    <section id="summary" class="summary-grid" aria-live="polite"></section>

    <section class="toolbar">
      <label class="search">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Найти сотрудника">
      </label>
      <span id="resultCount" class="result-count"></span>
    </section>

    <section id="employeeList" class="employee-list" aria-live="polite">
      <div class="loading-card"></div>
      <div class="loading-card"></div>
      <div class="loading-card"></div>
    </section>
  </main>

  <dialog id="employeeDialog" class="dialog">
    <div class="dialog-header">
      <div>
        <p id="dialogLogin" class="eyebrow"></p>
        <h2 id="dialogName"></h2>
      </div>
      <button class="icon-button close-dialog" aria-label="Закрыть">×</button>
    </div>
    <div id="dialogContent"></div>
  </dialog>

  <dialog id="penaltyDialog" class="dialog dialog-small">
    <form id="penaltyForm">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Штраф −10% KPI</p>
          <h2 id="penaltyEmployee"></h2>
        </div>
        <button type="button" class="icon-button close-dialog" aria-label="Закрыть">×</button>
      </div>
      <label class="field">
        <span>Причина</span>
        <textarea id="penaltyReason" maxlength="500" required placeholder="Кратко опишите причину штрафа"></textarea>
      </label>
      <button class="primary-button" type="submit">Добавить штраф</button>
    </form>
  </dialog>

  <dialog id="entriesDialog" class="dialog dialog-small">
    <div class="dialog-header">
      <div>
        <p id="entriesEmployee" class="eyebrow"></p>
        <h2 id="entriesTitle"></h2>
      </div>
      <button class="icon-button close-dialog" aria-label="Закрыть">×</button>
    </div>
    <p id="entriesPeriod" class="entries-period"></p>
    <div id="entriesContent" class="entries-list"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
