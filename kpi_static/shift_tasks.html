<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#052c32">
  <title>Задачи смены · OMG SHIFT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/furore" rel="stylesheet">
  <link rel="stylesheet" href="/static/shift_config.css">
  <link rel="stylesheet" href="/static/shift_tasks.css?v=20260902-1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body data-swipe-back="/shift">
  <main class="task-shell">
    <header class="task-header">
      <div>
        <a class="back" href="/shift">‹ OMG Shift</a>
        <p class="eyebrow">Контроль смены</p>
        <h1>ЗАДАЧИ</h1>
      </div>
      <span id="taskRole" class="role-pill">Загрузка…</span>
    </header>

    <section class="task-summary">
      <article><small>Активные</small><strong id="activeCount">0</strong></article>
      <article><small>Просрочены</small><strong id="overdueCount">0</strong></article>
      <article><small>Готовы</small><strong id="completedCount">0</strong></article>
      <article><small>Пропущены</small><strong id="skippedCount">0</strong></article>
    </section>

    <nav class="task-tabs" aria-label="Раздел задач">
      <button class="active" type="button" data-scope="active">Сегодня</button>
      <button type="button" data-scope="history">История · 30 дней</button>
    </nav>

    <div id="clubFilters" class="club-filters" hidden></div>
    <div id="taskNotice" class="task-notice" hidden></div>
    <section id="taskList" class="task-list">
      <div class="task-empty">Загружаю задачи…</div>
    </section>
  </main>

  <dialog id="taskDialog">
    <div class="dialog-head">
      <span id="dialogStatus" class="status-pill"></span>
      <button id="closeTaskDialog" class="dialog-close" type="button" aria-label="Закрыть">×</button>
    </div>
    <p id="dialogClub" class="dialog-club"></p>
    <h2 id="dialogTitle"></h2>
    <p id="dialogMeta" class="dialog-meta"></p>
    <p id="dialogInstructions" class="dialog-instructions"></p>
    <ol id="dialogRequirements" class="requirement-list"></ol>
    <div id="finishedInfo" class="finished-info" hidden></div>

    <button id="startTask" class="primary full" type="button">Начать отчёт</button>

    <section id="reportEditor" class="report-editor" hidden>
      <div class="editor-head">
        <div><small>Отчёт</small><strong id="attachmentCounter">0 из 1</strong></div>
        <span>Фото или видео</span>
      </div>
      <div class="attachment-actions">
        <button id="openTaskCamera" class="camera" type="button">Камера</button>
        <button id="pickTaskFiles" class="files" type="button">Прикрепить файлы</button>
      </div>
      <input id="taskCameraInput" type="file" accept="image/*,video/*" capture="environment" hidden>
      <input id="taskFileInput" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" multiple hidden>
      <div id="attachmentList" class="attachment-list"></div>
      <button id="completeTask" class="primary full" type="button">Завершить и отправить</button>
      <button id="showSkipForm" class="skip-link" type="button">Пропустить с причиной</button>
      <div id="skipForm" class="skip-form" hidden>
        <label for="skipReason">Почему задача не выполнена?</label>
        <textarea id="skipReason" maxlength="500" placeholder="Причина будет отправлена в отчётный чат"></textarea>
        <button id="skipTask" class="danger full" type="button">Подтвердить пропуск</button>
      </div>
    </section>
    <p id="dialogError" class="dialog-error" hidden></p>
  </dialog>

  <script src="/static/shift_tasks.js?v=20260902-1"></script>
  <script src="/static/swipe_navigation.js"></script>
</body>
</html>
