<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0913">
  <title>OMG Shift — OMG VR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/furore" rel="stylesheet">
  <link rel="stylesheet" href="/static/shift_config.css?v=20260902-3">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="shell">
    <header>
      <div class="shift-title"><a href="/shift" class="back">‹ OMG Shift</a><p class="eyebrow">Команда OMG VR</p><h1>OMG SHIFT</h1><p class="subtitle">Сценарии открытия и закрытия смен</p></div>
      <button id="saveButton" class="primary">Сохранить</button>
    </header>

    <div id="notice" class="notice" hidden></div>
    <section id="editor" hidden>
      <div class="toolbar">
        <label>Клуб<select id="clubSelect"></select></label>
        <div class="actions" role="tablist">
          <button class="action-tab active" data-action="open">Открытие</button>
          <button class="action-tab" data-action="close">Закрытие</button>
        </div>
      </div>

      <div class="variant-bar">
        <div id="variantTabs" class="variant-tabs"></div>
        <button id="addVariant" class="soft">+ Набор</button>
      </div>

      <section class="panel">
        <div class="panel-head"><div><p class="eyebrow">Вопрос и подготовка к нему</p><h2>Вопросы смены</h2></div><button id="addQuestion" class="soft">+ Вопрос</button></div>
        <div id="questionList" class="item-list"></div>
      </section>

      <div class="bottom-actions">
        <button id="previewButton" class="soft">Предпросмотр</button>
        <button id="removeVariant" class="danger">Удалить набор</button>
      </div>

      <details class="history-panel">
        <summary>История изменений</summary>
        <p class="hint">Откат создаёт новую версию и сразу применяет её в боте.</p>
        <div id="historyList" class="history-list"></div>
      </details>
    </section>
  </main>

  <dialog id="previewDialog">
    <div class="dialog-head"><h2>Как увидит сотрудник</h2><button id="closePreview" class="icon-button">×</button></div>
    <div id="previewContent"></div>
  </dialog>
  <script src="/static/shift_config.js?v=20260903-1"></script>
  <script src="/static/swipe_navigation.js"></script>
  <script src="/static/employee_preview.js?v=20260903-1"></script>
</body>
</html>
