services:
  bot:
    build: .
    restart: always
    env_file:
      - .env
    volumes:
      - ./db:/app/db
      - ./data:/app/data
      - ./key:/app/key
      - ./Reports:/app/Reports
  kpi_web:
    build: .
    command:
      - "gunicorn"
      - "--bind=0.0.0.0:8080"
      - "--workers=2"
      - "--threads=4"
      - "--timeout=60"
      - "kpi_web:app"
    restart: always
    env_file:
      - .env
    volumes:
      - ./db:/app/db
      - ./data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      kpi_web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
